name: Submodule updates

on:
  schedule:
    - cron: '13 13 * * *'
  workflow_dispatch:

concurrency:
  group: submodule-updates
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          submodules: recursive

      - name: Update upstream submodule revisions
        run: git submodule update --remote

      - name: Create signed update pull request
        id: pull-request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          sign-commits: true
          branch: automation/submodule-updates
          delete-branch: true
          add-paths: lib
          commit-message: Update submodule revisions
          title: Update external submodule revisions
          body: |
            External submodule branches have new commits. This PR updates their recorded revisions for local synchronization.

      - name: Approve or retry pull request validation
        if: steps.pull-request.outputs.pull-request-number != ''
        run: bash .github/scripts/check-submodule-update.sh
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/submodule-updates
          UPDATE_HEAD: ${{ steps.pull-request.outputs.pull-request-head-sha }}
          UPDATE_PR: ${{ steps.pull-request.outputs.pull-request-number }}
          UPDATE_RECOVER_MISSING: 'true'
